# Loyalty programme reference data.
#
# WHAT IS DELIBERATELY NOT HERE: award prices and bank transfer ratios.
#
# Both change often, neither is published in a machine-readable form, and the
# only sources are content sites that contradict each other. A transfer is
# irreversible — someone acting on a wrong ratio loses the points permanently —
# so this file carries none of those numbers. The points engine asks the
# traveller for the award quote they are actually looking at instead, and does
# the arithmetic on a figure that is correct by construction.
#
# What IS here is structural and slow-moving: which programme belongs to which
# airline, which alliance it can book across, and which programmes share a
# currency. That is enough to answer "could my points touch this flight", which
# is the question a cash-fare search is uniquely placed to help with.
#
# `books_alliance` means the programme can issue awards on that alliance's
# members. `currency_pool` means balances move freely between those programmes
# at 1:1, so they can be treated as one pot.

programs:
  maharaja_club:
    name: Maharaja Club
    airline: AI
    books_alliance: star_alliance

  six_e_rewards:
    name: 6E Rewards
    airline: 6E
    # IndiGo's scheme pays out as a discount on a future fare rather than an
    # award seat, so it never competes on an award chart. Treated as cash-off.
    redeems_as: fare_discount

  krisflyer:
    name: KrisFlyer
    airline: SQ
    books_alliance: star_alliance

