# Carrier reference data.
#
# `class` drives the budget-vs-full-service filter. It is a judgement call at
# the margins, so the rule used here is: does the base fare normally include a
# checked bag and a meal? Carriers that sell those separately but still offer a
# real business cabin are `hybrid` rather than `low_cost`.
#
# `alliance` drives mileage earn/burn in the points engine.
#
# India-first by design: Indian carriers and the routes Indian travellers
# actually fly are complete; the rest is the long-haul network they connect to.

carriers:
  # --- India ---
  6E: { name: IndiGo, class: low_cost, country: IN }
  AI: { name: Air India, class: full_service, alliance: star_alliance, country: IN }
  IX: { name: Air India Express, class: low_cost, country: IN }
